<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#fdf8f9" id="metaTheme" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Future pharmacist" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/jpeg" href="icon.jpg" />
  <link rel="apple-touch-icon" href="icon.jpg" />
  <title>Future pharmacist</title>
  <style>
    :root {
      --bg: #fdf8f9;
      --card: #ffffff;
      --hero-bg: linear-gradient(180deg, #fff5f7 0%, #fcebf0 100%);
      --border: #f2dce3;
      --shadow: 0 4px 16px rgba(219, 112, 147, 0.08);
      --primary: #e26d97;
      --primary-soft: #fdebf1;
      --text: #2b2125;
      --muted: #8a757d;
      --success: #229954;
      --success-bg: #eafaf1;
      --danger: #d9434e;
      --danger-bg: #fdedee;
      --clinical: #0284c7;
      --clinical-bg: #e0f2fe;
      --warn: #b7791f;
      --warn-bg: #fef3c7;
    }

    [data-theme="dark"] {
      --bg: #0f0c0e;
      --card: #1a1518;
      --hero-bg: linear-gradient(180deg, #1f171c 0%, #171215 100%);
      --border: #2e242a;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      --primary: #f472b6;
      --primary-soft: rgba(244, 114, 182, 0.14);
      --text: #f4eef1;
      --muted: #9e8d95;
      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.14);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.14);
      --clinical: #38bdf8;
      --clinical-bg: rgba(56, 189, 248, 0.15);
      --warn: #fbbf24;
      --warn-bg: rgba(251, 191, 36, 0.15);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      padding: 12px 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
    }
    .icon-btn:active { transform: scale(0.94); }

    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 90; display: none;
    }
    .overlay.show { display: block; }
    .drawer {
      position: fixed; top: 0; right: -300px; width: 280px; height: 100vh;
      background: var(--card); border-left: 1px solid var(--border);
      z-index: 100; transition: right 0.25s ease;
      display: flex; flex-direction: column; padding: 18px 14px; overflow-y: auto;
    }
    .drawer.open { right: 0; }
    .drawer-head {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px;
    }
    .drawer-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .drawer-brand img { width: 34px; height: 34px; border-radius: 10px; object-fit: cover; }
    .drawer-item {
      width: 100%; text-align: right; background: transparent; border: none;
      color: var(--text); padding: 11px 12px; border-radius: 12px; margin-bottom: 4px;
      cursor: pointer; font-size: 14px; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center;
    }
    .drawer-item:hover { background: var(--primary-soft); color: var(--primary); }
    .drawer-sub { padding-right: 24px; font-size: 13px; color: var(--muted); font-weight: 500; }
    .drawer-section { font-size: 12px; color: var(--muted); margin: 12px 10px 6px; font-weight: 700; }

    main { max-width: 640px; margin: 0 auto; padding: 8px 16px 40px; }

    .hero-card {
      background: var(--hero-bg);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px 16px;
      text-align: center;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
    }
    .hero-logo {
      width: 78px; height: 78px; border-radius: 50%; object-fit: cover;
      background: #fff; padding: 5px; margin-bottom: 10px;
      box-shadow: 0 4px 14px rgba(226, 109, 151, 0.22);
    }
    .hero-title {
      margin: 0; font-size: 20px; font-weight: 800; color: var(--text);
      letter-spacing: 0.2px;
    }

    .section-title {
      font-size: 16px; font-weight: 800; margin: 0 4px 12px; color: var(--text);
    }

    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .subject-tile {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px 14px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 138px;
    }
    .subject-tile:active { transform: scale(0.96); }
    .subject-tile:hover { border-color: var(--primary); }
    .tile-icon {
      width: 52px; height: 52px; border-radius: 16px;
      background: var(--primary-soft); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }
    .tile-name { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.4; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .lec-card {
      cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      transition: transform 0.15s, border-color 0.15s;
    }
    .lec-card:active { transform: scale(0.98); }
    .lec-card:hover { border-color: var(--primary); }

    .badge {
      display: inline-block; font-size: 11.5px; padding: 4px 10px;
      border-radius: 999px; background: var(--primary-soft);
      color: var(--primary); font-weight: 700; white-space: nowrap;
    }
    .badge-clinical { background: var(--clinical-bg); color: var(--clinical); }
    .badge-warn { background: var(--warn-bg); color: var(--warn); }

    .btn {
      width: 100%; padding: 13px 16px; border-radius: 14px; border: none;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-outline {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); margin-top: 8px;
    }

    .form-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    .range-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .input-box {
      width: 100%; padding: 11px 12px; border-radius: 12px;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-size: 15px; font-weight: 600;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .chip {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 7px 12px; border-radius: 999px; font-size: 12px; cursor: pointer; font-weight: 600;
    }
