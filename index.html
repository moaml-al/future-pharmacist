      --success: #34d399;
      --success-bg: rgba(16, 185, 129, 0.14);
      --danger: #fb7185;
      --danger-bg: rgba(244, 63, 94, 0.14);
      --warn: #fbbf24;
      --warn-bg: rgba(245, 158, 11, 0.14);
      --clinical: #38bdf8;
      --clinical-bg: rgba(56, 189, 248, 0.14);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      width: 40px; height: 40px; border-radius: 12px; font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow);
    }
    .icon-btn:active { transform: scale(0.94); }
    .menu-btn {
      background: var(--primary); color: #fff; border: none;
      padding: 0 14px; height: 40px; border-radius: 12px; font-size: 14px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow);
    }

    /* Sidebar Drawer */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      z-index: 90; display: none; backdrop-filter: blur(2px);
    }
    .overlay.show { display: block; }
    .drawer {
      position: fixed; top: 0; right: -320px; width: 300px; max-width: 85vw; height: 100vh;
      background: var(--card); border-left: 1px solid var(--border);
      z-index: 100; transition: right 0.25s ease;
      display: flex; flex-direction: column; box-shadow: -8px 0 28px rgba(0,0,0,0.25);
    }
    .drawer.open { right: 0; }
    .drawer-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px; border-bottom: 1px solid var(--border); background: var(--hero-bg);
    }
    .drawer-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; }
    .drawer-brand img { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; background: #fff; padding: 2px; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 14px; }
    .drawer-section { font-size: 11.5px; color: var(--primary); margin: 14px 6px 8px; font-weight: 800; }
    .drawer-home-btn {
      width: 100%; background: var(--primary); color: #fff; border: none;
      padding: 12px 14px; border-radius: 12px; font-weight: 700; font-size: 14px;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .drawer-item {
      width: 100%; text-align: right; background: var(--card-soft);
      border: 1px solid var(--border); color: var(--text);
      padding: 11px 12px; border-radius: 12px; margin-bottom: 8px;
      cursor: pointer; font-size: 13.5px; font-weight: 700;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .drawer-sub { background: transparent; border-style: dashed; font-size: 13px; font-weight: 600; padding: 9px 12px; }

    main { max-width: 1140px; margin: 0 auto; padding: 16px 14px 60px; }
    .narrow-wrap { max-width: 680px; margin: 0 auto; }

    /* Home View */
    .hero-card {
      background: var(--hero-bg); border: 1px solid var(--border); border-radius: 24px;
      padding: 28px 16px; text-align: center; margin-bottom: 22px; box-shadow: var(--shadow);
    }
    .hero-logo {
      width: 82px; height: 82px; border-radius: 50%; object-fit: cover;
      background: #fff; padding: 5px; margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(226, 109, 151, 0.25);
    }
    .hero-title { margin: 0; font-size: 22px; font-weight: 800; }
    .section-title { font-size: 16px; font-weight: 800; margin: 0 4px 14px; }

    .subjects-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .subject-tile {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 22px 14px; text-align: center; cursor: pointer; box-shadow: var(--shadow);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; min-height: 142px; transition: transform 0.15s, border-color 0.15s;
    }
    .subject-tile:active { transform: scale(0.96); }
    .subject-tile:hover { border-color: var(--primary); }
    .tile-icon {
      width: 54px; height: 54px; border-radius: 16px;
      background: var(--primary-soft); color: var(--primary);
      display: flex; align-items: center; justify-content: center; font-size: 27px;
    }
    .tile-name { font-size: 15.5px; font-weight: 800; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow);
    }
    .lec-card {
      cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .lec-card:hover { border-color: var(--primary); }

    .badge {
      display: inline-block; font-size: 11.5px; padding: 4px 10px;
      border-radius: 999px; background: var(--primary-soft);
      color: var(--primary); font-weight: 700; white-space: nowrap;
    }
    .badge-clinical { background: var(--clinical-bg); color: var(--clinical); }
    .badge-warn { background: var(--warn-bg); color: var(--warn); }

    /* Exam Controls */
    .exam-header-top {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 14px;
    }
    .exam-title-wrap { display: flex; align-items: center; gap: 10px; }
    .exam-title { margin: 4px 0 0; font-size: 17px; font-weight: 800; }

    .reshuffle-btn {
      background: #f59e0b; color: #111827; border: none;
      padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer;
    }
    .stats-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .stat-pill {
      background: var(--card-soft); border: 1px solid var(--border);
      padding: 7px 12px; border-radius: 12px; font-size: 12.5px; font-weight: 700;
    }
    .stat-pill.ok { background: var(--success-bg); border-color: var(--success); color: var(--success); }
    .stat-pill.bad { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

    .dist-bar {
      background: var(--card-soft); border: 1px solid var(--border);
      padding: 8px 12px; border-radius: 12px; margin-bottom: 14px;
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 700; color: var(--muted);
    }
    .dist-badges { display: flex; gap: 6px; font-family: monospace; }
    .dist-badge { background: var(--primary-soft); color: var(--primary); padding: 3px 8px; border-radius: 6px; font-weight: 800; }

    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-btn {
      background: var(--card-soft); border: 1px solid var(--border); color: var(--text);
      padding: 8px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    }
    .filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* Questions Grid: 1 column on Mobile, 2 columns side-by-side on iPad & Laptop */
    .questions-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }
    @media (min-width: 768px) {
      .questions-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .questions-grid .card { margin-bottom: 0; }

    .q-card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
    .q-num { background: var(--primary-soft); color: var(--primary); padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; }
    .q-text {
      direction: ltr; text-align: left; font-size: 15px; font-weight: 700;
      line-height: 1.6; margin: 0 0 14px;
    }
    .opts-grid { display: grid; grid-template-columns: 1fr; gap: 9px; }
    .opt-btn {
      width: 100%; direction: ltr; text-align: left;
      background: var(--card-soft); border: 1px solid var(--border); color: var(--text);
      padding: 11px 12px; border-radius: 13px; cursor: pointer;
      display: flex; align-items: center; gap: 10px; font-size: 13.5px; line-height: 1.45;
      transition: all 0.15s;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--primary); }
    .opt-letter {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--border); color: var(--text);
      font-weight: 800; font-size: 12.5px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .opt-btn.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); font-weight: 700; }
    .opt-btn.correct .opt-letter { background: var(--success); color: #fff; }
    .opt-btn.wrong { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); font-weight: 700; }
    .opt-btn.wrong .opt-letter { background: var(--danger); color: #fff; }
    .opt-btn.faded { opacity: 0.55; }
    .opt-btn:disabled { cursor: default; }

    .explain-box {
      margin-top: 12px; padding: 12px 14px; border-radius: 12px;
      font-size: 13.5px; line-height: 1.7;
      border: 1px solid var(--warn); background: var(--warn-bg); color: var(--text);
    }
    .explain-box.ok { background: var(--success-bg); border-color: var(--success); }

    /* Final Summary Card at Bottom */
    .summary-card {
      margin-top: 22px;
      background: var(--hero-bg);
      border: 2px solid var(--primary);
      border-radius: 24px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .summary-score { font-size: 44px; font-weight: 900; color: var(--primary); margin: 4px 0; }
    .summary-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      max-width: 460px; margin: 16px auto 20px;
    }
    .summary-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 8px;
    }
    .summary-box strong { display: block; font-size: 20px; margin-bottom: 2px; }
    .summary-box span { font-size: 12px; color: var(--muted); font-weight: 700; }

    .btn-primary {
      background: var(--primary); color: #fff; border: none;
      padding: 13px 20px; border-radius: 14px; font-size: 14.5px; font-weight: 800;
      cursor: pointer; margin: 5px; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-danger {
      background: var(--danger); color: #fff; border: none;
      padding: 13px 20px; border-radius: 14px; font-size: 14.5px; font-weight: 800;
      cursor: pointer; margin: 5px; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-outline {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 11px 18px; border-radius: 12px; font-weight: 700; font-size: 13.5px; cursor: pointer; margin: 5px;
    }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--primary); color: #fff; padding: 10px 18px; border-radius: 999px;
      font-size: 13px; font-weight: 700; z-index: 200; display: none;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>

  <header class="topbar">
    <button class="menu-btn" onclick="toggleDrawer()">
      <span>☰</span>
      <span>القائمة</span>
    </button>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" aria-label="المظهر">🌙</button>
      <button class="icon-btn" onclick="syncCatalog(true)" aria-label="تحديث">↻</button>
    </div>
  </header>

  <div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="drawer-brand">
        <img src="icon.jpg" alt="Logo" />
        <span>Future pharmacist</span>
      </div>
      <button class="icon-btn" style="width:34px;height:34px;" onclick="toggleDrawer()">✕</button>
    </div>
    <div class="drawer-body">
      <button class="drawer-home-btn" onclick="showHome(); toggleDrawer();">
        <span>🏠 الواجهة الرئيسية</span>
        <span>←</span>
      </button>
      <div class="drawer-section">المواد والامتحانات (MCQ)</div>
      <div id="drawerMenu"></div>
    </div>
  </aside>

  <main id="app"></main>
  <div class="toast" id="toast"></div>

  <script>
    const CATALOG_KEY = 'fp_catalog_v5';
    const FILE_PREFIX = 'fp_file_v5_';
    const THEME_KEY = 'fp_theme_v5';

    let catalog = { appTitle: 'Future pharmacist', subjects: [] };
    let currentExamTitle = '';
    let currentExamBadge = '';
    let rawPool = [];
    let activeQuestions = [];
    let userAnswers = {};
    let currentFilter = 'all';

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem(THEME_KEY, theme);
      document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
      document.getElementById('metaTheme').setAttribute('content', theme === 'dark' ? '#0b0f19' : '#fdf8f9');
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(current === 'light' ? 'dark' : 'light');
    }

    function fisherYatesShuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function toggleDrawer() {
      document.getElementById('drawer').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('show');
    }

    async function initApp() {
      const cached = localStorage.getItem(CATALOG_KEY);
      if (cached) {
        try {
          catalog = JSON.parse(cached);
          renderDrawer();
          showHome();
        } catch (e) {}
      }
      await syncCatalog(false);
    }

    async function syncCatalog(manual = false) {
      try {
        const res = await fetch('./catalog.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error();
        const fresh = await res.json();
        const oldStr = localStorage.getItem(CATALOG_KEY);
        const newStr = JSON.stringify(fresh);

        catalog = fresh;
        localStorage.setItem(CATALOG_KEY, newStr);
        renderDrawer();

        if (!oldStr || oldStr !== newStr) {
          showHome();
          if (manual) showToast('تم التحديث بنجاح');
        } else if (manual) {
          showToast('محدّث لآخر نسخة');
        }
      } catch (e) {
        if (manual) showToast('تعذّر التحديث، تأكد من الاتصال');
        showHome();
      }
    }

    async function fetchQuizFile(fileName) {
      const key = FILE_PREFIX + fileName;
      try {
        const res = await fetch('./' + fileName + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('الملف غير موجود (' + res.status + ')');
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (parseErr) {
          throw new Error('خطأ في صيغة ملف JSON (احتمال ناقص قوس)');
        }
        localStorage.setItem(key, JSON.stringify(data));
        return data;
      } catch (e) {
        const cached = localStorage.getItem(key);
        if (cached) return JSON.parse(cached);
        throw e;
      }
    }

    function renderDrawer() {
      if (!catalog) return;
      let html = '';
      (catalog.subjects || []).forEach(sub => {
        html += `<button class="drawer-item" onclick="showSubject('${sub.id}'); toggleDrawer();">
          <span>${sub.icon || '💊'} ${sub.name}</span>
          <span class="badge">${(sub.files || []).length}</span>
        </button>`;
        (sub.files || []).forEach(f => {
          html += `<button class="drawer-item drawer-sub" onclick="openFileExam('${f.file}', '${f.title.replace(/'/g, "\\'")}', '${sub.name.replace(/'/g, "\\'")}'); toggleDrawer();">
            <span>📄 ${f.title}</span>
            ${f.count ? `<span style="font-size:11px;color:var(--muted);">${f.count} سؤال</span>` : ''}
          </button>`;
        });
      });
      document.getElementById('drawerMenu').innerHTML = html;
    }

    function showHome() {
      let html = `
        <div class="narrow-wrap">
          <div class="hero-card">
            <img src="icon.jpg" alt="Future pharmacist" class="hero-logo" />
            <h1 class="hero-title">${catalog.appTitle || 'Future pharmacist'}</h1>
          </div>
          <h2 class="section-title">المواد الدراسية</h2>
      `;

      const subs = catalog.subjects || [];
      if (subs.length > 0) {
        html += `<div class="subjects-grid">`;
        subs.forEach(sub => {
          html += `
            <div class="subject-tile" onclick="showSubject('${sub.id}')">
              <div class="tile-icon">${sub.icon || '💊'}</div>
              <div class="tile-name">${sub.name}</div>
            </div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
      document.getElementById('app').innerHTML = html;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showSubject(subId) {
      const sub = (catalog.subjects || []).find(s => s.id === subId);
      if (!sub) return;

      let html = `
        <div class="narrow-wrap">
          <button class="btn-outline" style="margin:0 0 14px;" onclick="showHome()">→ المواد الدراسية</button>
          <div class="card" style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
            <div style="display:flex; align-items:center; gap:12px;">
              <div class="tile-icon" style="width:46px;height:46px;font-size:22px;">${sub.icon || '💊'}</div>
              <h2 style="margin:0; font-size:18px;">${sub.name}</h2>
            </div>
            ${(sub.files || []).length > 1 ? `<button class="badge" style="border:none;cursor:pointer;padding:8px 14px;" onclick="openSubjectCombined('${sub.id}')">⚡ امتحان شامل</button>` : ''}
          </div>
      `;

      (sub.files || []).forEach(f => {
        html += `
          <div class="card lec-card" onclick="openFileExam('${f.file}', '${f.title.replace(/'/g, "\\'")}', '${sub.name.replace(/'/g, "\\'")}')">
            <strong style="font-size:15px;">${f.title}</strong>
            ${f.count ? `<span class="badge">${f.count} سؤال</span>` : ''}
          </div>`;
      });

      html += `</div>`;
      document.getElementById('app').innerHTML = html;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function openFileExam(fileName, title, subName) {
      try {
        const data = await fetchQuizFile(fileName);
        rawPool = (data.questions || []).map(q => ({ ...q, lecTag: title }));
        currentExamTitle = data.title || title;
        currentExamBadge = subName || title;
        startExamEngine();
      } catch (e) {
        showToast(e.message || 'تعذّر تحميل الملف');
      }
    }

    async function openSubjectCombined(subId) {
      const sub = catalog.subjects.find(s => s.id === subId);
      if (!sub) return;
      try {
        let combined = [];
        for (const f of sub.files) {
          const d = await fetchQuizFile(f.file);
          (d.questions || []).forEach(q => combined.push({ ...q, lecTag: f.title }));
        }
        rawPool = combined;
        currentExamTitle = 'امتحان شامل: ' + sub.name;
        currentExamBadge = sub.name;
        startExamEngine();
      } catch (e) {
        showToast(e.message || 'تعذّر تحميل الملفات');
      }
    }

    function prepareBalancedQuestions(pool) {
      const shuffledQs = fisherYatesShuffle(pool);
      const targetPositions = [];
      for (let i = 0; i < shuffledQs.length; i++) targetPositions.push(i % 4);
      const randomizedSlots = fisherYatesShuffle(targetPositions);

      return shuffledQs.map((qObj, idx) => {
        const correctText = qObj.correct !== undefined ? qObj.correct : qObj.options[qObj.answer];
        const distractors = fisherYatesShuffle(qObj.options.filter(o => o !== correctText));
        const targetIdx = randomizedSlots[idx];
        const finalOpts = [];
        let d = 0;
        for (let p = 0; p < 4; p++) {
          if (p === targetIdx) finalOpts.push(correctText);
          else finalOpts.push(distractors[d++] || '');
        }
        return {
          id: idx,
          q: qObj.q,
          options: finalOpts,
          correctIndex: targetIdx,
          exp: qObj.explanation || qObj.exp || '',
          lecTag: qObj.lecTag || currentExamTitle,
          type: qObj.type || '',
          difficulty: qObj.difficulty || ''
        };
      });
    }

    function startExamEngine() {
      userAnswers = {};
      currentFilter = 'all';
      activeQuestions = prepareBalancedQuestions(rawPool);
      renderExamView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function reshuffleExam() {
      userAnswers = {};
      currentFilter = 'all';
      activeQuestions = prepareBalancedQuestions(rawPool);
      renderExamView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showToast('تم خلط الأسئلة والاختيارات من جديد');
    }

    function setFilter(f, scrollTop = false) {
      currentFilter = f;
      renderExamView();
      if (scrollTop) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectAnswer(qIdx, optIdx) {
      if (userAnswers[qIdx] !== undefined) return;
      userAnswers[qIdx] = optIdx;
      renderExamView();
    }

    function renderExamView() {
      const letters = ['A', 'B', 'C', 'D'];
      const total = activeQuestions.length;
      const answeredKeys = Object.keys(userAnswers);
      let correctCount = 0, wrongCount = 0;
      answeredKeys.forEach(k => {
        const i = parseInt(k, 10);
        if (userAnswers[i] === activeQuestions[i].correctIndex) correctCount++;
        else wrongCount++;
      });
      const pct = answeredKeys.length > 0 ? Math.round((correctCount / answeredKeys.length) * 100) : 0;

      const dist = [0, 0, 0, 0];
      activeQuestions.forEach(q => dist[q.correctIndex]++);

      const filtered = activeQuestions.filter((q, idx) => {
        if (currentFilter === 'unanswered') return userAnswers[idx] === undefined;
        if (currentFilter === 'wrong') return userAnswers[idx] !== undefined && userAnswers[idx] !== q.correctIndex;
        return true;
      });

      let html = `
        <div class="card">
          <div class="exam-header-top">
            <div class="exam-title-wrap">
              <button class="icon-btn" onclick="showHome()" title="الرئيسية">→</button>
              <div>
                <span class="badge">${currentExamBadge}</span>
                <h2 class="exam-title">${currentExamTitle}</h2>
              </div>
            </div>
            <button class="reshuffle-btn" onclick="reshuffleExam()">🎲 إعادة خلط (A,B,C,D)</button>
          </div>

          <div class="stats-row">
            <div class="stat-pill">الإجابات: ${answeredKeys.length} / ${total}</div>
            <div class="stat-pill ok">✓ صحيحة: ${correctCount}</div>
            <div class="stat-pill bad">✕ خاطئة: ${wrongCount}</div>
            <div class="stat-pill">النسبة: ${pct}%</div>
          </div>

          <div class="dist-bar">
            <span>توزيع الإجابات الصحيحة:</span>
            <div class="dist-badges">
              ${letters.map((L, i) => `<span class="dist-badge">${L}:${dist[i]}</span>`).join('')}
            </div>
          </div>

          <div class="filter-row">
            <button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">الكل (${total})</button>
            <button class="filter-btn ${currentFilter === 'unanswered' ? 'active' : ''}" onclick="setFilter('unanswered')">غير محلول (${total - answeredKeys.length})</button>
            <button class="filter-btn ${currentFilter === 'wrong' ? 'active' : ''}" onclick="setFilter('wrong')">الأخطاء فقط (${wrongCount})</button>
          </div>
        </div>
      `;

      if (filtered.length === 0) {
        html += `
          <div class="card" style="text-align:center; padding:32px 16px;">
            <p style="font-weight:800; margin:0 0 12px;">لا توجد أسئلة مطابقة لهذا الفلتر حالياً!</p>
            <button class="filter-btn active" onclick="setFilter('all', true)">عرض جميع الأسئلة</button>
          </div>
        `;
      } else {
        html += `<div class="questions-grid">` + filtered.map(q => {
          const sel = userAnswers[q.id];
          const isAns = sel !== undefined;
          const optsHtml = q.options.map((optText, optIdx) => {
            let cls = 'opt-btn';
            if (isAns) {
              if (optIdx === q.correctIndex) cls += ' correct';
              else if (optIdx === sel) cls += ' wrong';
              else cls += ' faded';
            }
            return `
              <button class="${cls}" ${isAns ? 'disabled' : ''} onclick="selectAnswer(${q.id}, ${optIdx})">
                <span class="opt-letter">${letters[optIdx]}</span>
                <span>${optText}</span>
              </button>
            `;
          }).join('');

          const expHtml = isAns && q.exp ? `
            <div class="explain-box ${sel === q.correctIndex ? 'ok' : ''}">
              <strong>${sel === q.correctIndex ? '✓ إجابة صحيحة (' + letters[q.correctIndex] + '):' : '✕ إجابة خاطئة — الصحيح هو (' + letters[q.correctIndex] + '):'}</strong>
              <div>${q.exp}</div>
            </div>
          ` : '';

          return `
            <div class="card">
              <div class="q-card-head">
                <span class="q-num">Question #${q.id + 1}</span>
                <div style="display:flex; gap:6px; flex-wrap:wrap;">
                  ${q.type === 'clinical' ? `<span class="badge badge-clinical">سريري</span>` : ''}
                  ${q.difficulty ? `<span class="badge badge-warn">${q.difficulty}</span>` : ''}
                </div>
              </div>
              <div class="q-text">${q.q}</div>
              <div class="opts-grid">${optsHtml}</div>
              ${expHtml}
            </div>
          `;
        }).join('') + `</div>`;
      }

      /* بطاقة النتيجة النهائية وزر مراجعة الأخطاء بالأخير */
      if (answeredKeys.length > 0) {
        const isFinished = answeredKeys.length === total;
        html += `
          <div class="summary-card">
            <span class="badge">${isFinished ? '🎉 أكملت الامتحان!' : 'ملخص أدائك لحد الآن'}</span>
            <div class="summary-score">${pct}%</div>
            <div class="summary-grid">
              <div class="summary-box">
                <strong style="color:var(--success);">${correctCount}</strong>
                <span>إجابة صحيحة</span>
              </div>
              <div class="summary-box">
                <strong style="color:var(--danger);">${wrongCount}</strong>
                <span>أخطاء</span>
              </div>
              <div class="summary-box">
                <strong>${total}</strong>
                <span>مجموع الأسئلة</span>
              </div>
            </div>
            <div>
              ${wrongCount > 0 ? `<button class="btn-danger" onclick="setFilter('wrong', true)">🔍 اضغط هنا لمراجعة أخطائك مع الشرح (${wrongCount})</button>` : `<p style="color:var(--success);font-weight:800;margin:0 0 10px;">عاشت إيدك! ما عندك ولا خطأ 👏</p>`}
              <button class="btn-primary" onclick="reshuffleExam()">🎲 إعادة الامتحان بخلط جديد</button>
              <button class="btn-outline" onclick="showHome()">🏠 الرئيسية</button>
            </div>
          </div>
        `;
      }

      document.getElementById('app').innerHTML = html;
    }

    applyTheme(localStorage.getItem(THEME_KEY) || 'light');
    showHome();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
    initApp();
  </script>
</body>
</html>
